name: Release

# Pushing a tag like v0.3.0 checks it matches the manifests, runs CI, and publishes the zips that
# CI built and tested.
on:
  push:
    tags: ["v*"]

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag must match manifest version
        run: |
          v="${GITHUB_REF_NAME#v}"
          for m in manifest.json manifest.firefox.json; do
            [ "$(python3 -c "import json;print(json.load(open('$m'))['version'])")" = "$v" ] \
              || { echo "$m version != $v"; exit 1; }
          done

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mail-code-copy
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes
