name: Release

# Pushing a tag like v0.3.0 checks it matches the manifests, runs CI, and publishes the zips that
# CI built and tested.
on:
  push:
    tags: ["v*"]

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag must match manifest version
        run: |
          v="${GITHUB_REF_NAME#v}"
          for m in manifests/chrome.json manifests/firefox.json; do
            [ "$(python3 -c "import json;print(json.load(open('$m'))['version'])")" = "$v" ] \
              || { echo "$m version != $v"; exit 1; }
          done

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # to sign the provenance
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mail-code-copy
          path: dist

      # A signed statement that these exact zips were built by this workflow from this commit.
      # Check a download with: gh attestation verify <zip> --repo <owner>/<repo>
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes
